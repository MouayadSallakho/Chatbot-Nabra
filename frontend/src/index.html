<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OmniAI Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The mark as SVG (it follows the browser's colour scheme), with the .ico for
      browsers that cannot use an SVG icon. Both are unhashed files from public/,
      which the edge caches for a year by extension: a new mark needs a new file
      name, not a new file under the old one.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <!--
      Theme resolution, before first paint.

      This runs synchronously in <head>, ahead of any stylesheet being applied to
      a rendered frame, so the correct palette is in place the moment the page is
      painted. Without it the browser paints the light default, Angular boots,
      and a dark-mode user sees a white flash on every single load -- the kind of
      detail that separates a product from a project.

      It is inline for the same reason: an external file is one more round trip
      during which that flash happens anyway.

      COUPLED TO ThemeService. The storage key, the attribute name and the two
      attribute values are duplicated here from src/app/core/theme/theme.ts. That
      duplication is deliberate and unavoidable -- this has to run before the
      bundle exists -- and it is asserted by a unit test that reads this file, so
      the two cannot drift apart silently.

      Wrapped in try/catch because localStorage throws outright, rather than
      returning null, in some privacy modes. A failure here must degrade to the
      light default, never to a blank page.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('omniai.theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <!--
      The deliberate initial state, painted before the bundle has parsed.

      Authentication is resolved before the first route renders, which is what
      stops a reload from flashing a sign-in form at somebody who is already
      signed in. The cost is two requests before first paint, and this covers
      that moment with something honest instead of a blank white page.

      It lives inside <app-root> so Angular replaces it on bootstrap; there is no
      code anywhere that has to remember to remove it. Its styles are inline
      (it has no component stylesheet), but every colour is a design token: the
      global stylesheet is a blocking <link> in <head>, so the tokens exist by
      the time this paints, and the script above has already chosen the theme.

      The mark is the same geometry as BrandMark and public/favicon.svg. It does
      not move: this is a loading state, not a splash screen.

      aria-live and role="status" so a screen reader is told something is
      happening rather than meeting silence.
    -->
    <app-root>
      <div
        style="
          display: grid;
          place-content: center;
          justify-items: center;
          gap: 0.75rem;
          min-height: 100vh;
          font-family: var(--font-sans, system-ui, sans-serif);
        "
      >
        <svg
          viewBox="2 4 23 23"
          width="40"
          height="40"
          aria-hidden="true"
          focusable="false"
          style="display: block"
        >
          <path
            style="fill: var(--voice-ai-fg, #0e7c72)"
            d="M4.4 18.35 3.5 23l4.7-1.6.54-.21A9.5 9.5 0 0 1 17.02 7 8.5 8.5 0 0 0 4.4 18.35Z"
          />
          <path
            style="fill: var(--voice-human-fg, #c2410c)"
            d="M17 9a7.5 7.5 0 0 1 5.8 12.25l.8 4.25-4.1-1.4A7.5 7.5 0 1 1 17 9Z"
          />
        </svg>
        <p
          role="status"
          aria-live="polite"
          style="margin: 0; color: var(--text-muted, #5f646d); font-size: 0.875rem"
        >
          Loading OmniAI…
        </p>
      </div>
    </app-root>
  </body>
</html>
