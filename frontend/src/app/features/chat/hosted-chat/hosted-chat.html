<!--
  Content first: the frame, the header and the composer are painted at once,
  with no splash. While the endpoint is read the panel says so in words.
-->
<main class="chat-page" id="main-content" tabindex="-1">
  <app-chat-panel
    class="chat-page-panel"
    variant="page"
    [state]="state()"
    [agentName]="agentName()"
    [messages]="messages()"
    [handling]="handling()"
    [sending]="sending()"
    [failure]="sendFailure()"
    [openFailure]="openFailure()?.message ?? null"
    [canSend]="canSend()"
    [hasConversation]="hasConversation()"
    [maxLength]="maxLength"
    [(draft)]="draft"
    (send)="send()"
    (newChat)="startNewConversation()"
    (retry)="open()"
  >
    <app-brand-mark chatBrand class="chat-page-mark" />
  </app-chat-panel>
</main>
