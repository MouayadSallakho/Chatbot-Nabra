<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nabra</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The mark (brand.md, direction A). The SVG follows the browser's colour
      scheme; the .ico (16, 32 and 48 px) is for browsers that cannot use an SVG
      icon, and the PNGs are its sizes on their own. The app icon (a rounded
      square with the mark at 62%) is the Apple touch icon and the manifest's.
      Every image is an unhashed file from public/, which the edge caches for a
      year by extension (`public, max-age=31536000, immutable` in deploy/edge),
      while this page and the manifest are served `no-cache`: a new mark needs
      new file names, never new files under the old ones. v2 since the Calm
      Glass brand step (Phase 39.8a); the next change is v3.
    -->
    <link rel="icon" href="nabra-icon.v2.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="nabra-icon.v2-16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="nabra-icon.v2-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="nabra-icon.v2-48.png" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="nabra-icon.v2.svg" sizes="any" />
    <link rel="apple-touch-icon" href="nabra-app-icon.v2-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!--
      Theme and language resolution, before first paint.

      This runs synchronously in <head>, ahead of any stylesheet being applied to
      a rendered frame, so the correct palette, language and direction are in
      place the moment the page is painted. Without it the browser paints the
      light, left-to-right default, Angular boots, and a dark-mode reader sees a
      white flash -- and an Arabic reader sees the whole layout jump from one
      side to the other -- on every single load.

      Language: `lang` and `dir` on <html>. They also choose the fonts, because
      every face carries a unicode-range and the Arabic type roles hang off
      :lang(ar). The customer-facing pages (/chat/ and /embed/) take ?lang=en or
      ?lang=ar when the link gives one, then follow the visitor's own browser --
      language and light or dark alike -- and never read or write a choice an
      admin stored in the same browser. Elsewhere an explicit choice wins and
      ?lang= means nothing, then the browser's first Arabic or English
      preference, then English. main.ts reads `lang` to decide which catalogue
      to load.

      It is inline for the same reason: an external file is one more round trip
      during which that flash happens anyway. It is ONE script on purpose: the
      edge allows inline code by hash (deploy/edge/csp-hashes.mjs), and one
      script is one hash to keep right.

      COUPLED TO ThemeService and LanguageService. The storage keys, the
      attribute name, the stored values and the public-page paths are duplicated
      here from src/app/core/theme/theme.ts and src/app/core/i18n/language.ts.
      That duplication is deliberate and unavoidable -- this has to run before
      the bundle exists -- and theme-startup.spec.ts runs this very script
      against fake browsers, so the two cannot drift apart silently.

      Transparency: the person's own "Reduce transparency" choice stamps
      data-transparency="reduced", so no glass layer ever paints see-through
      first. Admin pages only, like the theme: the visitor pages follow the
      visitor's own device (prefers-reduced-transparency, in the token layer).

      Fonts: a preload, at HTML parse, of exactly what the first paint of this
      language needs (Phase 39.2a, Phase 38 note 1). Geist Latin always: the
      Latin text and the digits of both languages. Arabic 400 on Arabic pages,
      and on English pages under /conversations, where customers often write in
      Arabic and the fallback otherwise showed for about 0.8 s; there at low
      priority, so it does not slow the bundle on a slow link. Nothing else:
      Latin Extended, 500, 600, 700 and the serif load when a glyph needs them.
      The URLs are the very ones in src/styles/_fonts.scss (versioned, unhashed
      files in public/fonts), so the stylesheet reuses the preloaded response
      and nothing downloads twice.

      Guarded parts because localStorage throws outright, rather than returning
      null, in some privacy modes. A failure must degrade to the light, English
      default with glass, never to a blank page, and a failure in one part must
      not cost the others.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var visitor = /^\/(chat|embed)\//.test(location.pathname);
        try {
          var stored = visitor ? null : localStorage.getItem('omniai.theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (_) {
          root.setAttribute('data-theme', 'light');
        }
        var lang = 'en';
        try {
          var chosen = null;
          if (visitor) {
            var linked = /[?&]lang=(en|ar)(?:&|$)/.exec(location.search);
            chosen = linked ? linked[1] : null;
          } else {
            try {
              chosen = localStorage.getItem('omniai.lang');
            } catch (_) {
              chosen = null;
            }
          }
          if (chosen === 'en' || chosen === 'ar') {
            lang = chosen;
          } else {
            var wanted = navigator.languages || [navigator.language];
            for (var i = 0; i < wanted.length; i++) {
              var tag = String(wanted[i]).toLowerCase();
              if (tag === 'ar' || tag.indexOf('ar-') === 0) {
                lang = 'ar';
                break;
              }
              if (tag === 'en' || tag.indexOf('en-') === 0) {
                break;
              }
            }
          }
        } catch (_) {
          lang = 'en';
        }
        root.setAttribute('lang', lang);
        root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        try {
          if (!visitor && localStorage.getItem('omniai.transparency') === 'reduced') {
            root.setAttribute('data-transparency', 'reduced');
          }
        } catch (_) {
          // Glass, then: the solid twin is a preference, not a requirement.
        }
        try {
          var arabic = '/fonts/ibm-plex-sans-arabic/ibm-plex-sans-arabic-arabic-400.v1.woff2';
          var fonts = [['/fonts/geist/geist-latin.v1.woff2', 'high']];
          if (lang === 'ar') {
            fonts.push([arabic, 'high']);
          } else if (/^\/conversations(\/|$)/.test(location.pathname)) {
            // Low: on an English page it must not slow the bundle it shares the link with.
            fonts.push([arabic, 'low']);
          }
          for (var f = 0; f < fonts.length; f++) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'font';
            link.type = 'font/woff2';
            link.crossOrigin = 'anonymous';
            link.fetchPriority = fonts[f][1];
            link.href = fonts[f][0];
            document.head.appendChild(link);
          }
        } catch (_) {
          // The stylesheet still finds every face; only the head start is lost.
        }
      })();
    </script>
    <!-- The boot status (in <body>) carries both languages; show the page's one. -->
    <style>
      html:not([lang='ar']) [data-boot-lang='ar'],
      html[lang='ar'] [data-boot-lang='en'] {
        display: none;
      }

      html[lang='ar'] .boot-name-latin {
        order: 1;
      }
    </style>
  </head>
  <body>
    <!--
      The deliberate initial state, painted before the bundle has parsed.

      Authentication is resolved before the first route renders, which is what
      stops a reload from flashing a sign-in form at somebody who is already
      signed in. The cost is two requests before first paint, and this covers
      that moment with something honest instead of a blank white page.

      It lives inside <app-root> so Angular replaces it on bootstrap; there is no
      code anywhere that has to remember to remove it. The first page is a lazy
      chunk that lands a moment later, so the root draws the same lockup
      (src/app/core/boot/boot-state.ts) until it does: keep the two in step. Its styles are inline
      (it has no component stylesheet), but every colour is a design token: the
      global stylesheet is a blocking <link> in <head>, so the tokens exist by
      the time this paints, and the script above has already chosen the theme.

      The lockup -- the mark and both names, outlined -- is BrandLockup's
      (Phase 39.2b). Nothing moves: this is a loading state, not a splash
      screen.

      aria-live and role="status" so a screen reader is told something is
      happening rather than meeting silence.

      The status is written in both languages, each marked with its own `lang`,
      and the rule in <head> shows only the one that matches <html lang>. The
      head script cannot reach the body (it does not exist yet) and nothing here
      writes markup from script, so the choice is made by CSS alone.
    -->
    <app-root>
      <div
        style="
          display: grid;
          place-content: center;
          justify-items: center;
          gap: 0.75rem;
          min-height: 100vh;
          font-family: var(--font-sans, system-ui, sans-serif);
        "
      >
        <!--
          The lockup (brand.md): the two-circle mark, then "Nabra" (Geist 600)
          and «نبرة» (IBM Plex Sans Arabic 700) as outlined paths, so it needs
          no font; on Arabic pages the Arabic name comes first (the rule in
          <head>). The geometry is BrandMark's and BrandLockup's
          (src/app/shared/brand-mark/brand-geometry.ts): keep them in step.
        -->
        <div
          class="boot-lockup"
          aria-hidden="true"
          style="
            display: flex;
            align-items: center;
            gap: 0.5em;
            font-size: 1.375rem;
            line-height: 1;
          "

        <p

        >
          <span data-boot-lang="en" lang="en">Loading…</span>
          <span data-boot-lang="ar" lang="ar">جارٍ التحميل…</span>
