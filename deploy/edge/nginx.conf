# OmniAI edge (nginx, unprivileged image). One origin serves everything:
#   /             the Angular SPA (static, SPA fallback)
#   /api/         the API
#   /hubs/        SignalR (WebSocket)
#   /widget/      the embeddable widget loader (served by the API)
# TLS terminates here; the API trusts X-Forwarded-Proto/-For from this proxy's
# fixed address only (ForwardedHeaders:KnownProxies).
#
# Routing is readiness-aware: readiness-watcher.sh probes every instance's
# /health/ready and marks an unready one `down` (no NEW requests) until it is
# ready again. Underneath, failover is also passive: an instance that refuses a
# connection or times out is skipped for 10 s and IDEMPOTENT requests (or ones
# never sent) move to the other. A request already sent with a non-idempotent
# method (POST/PUT/PATCH/DELETE) is never replayed -- a paid AI turn must not be
# sent twice. See docs/operations/production-deployment.md.

worker_processes auto;
# After a routing reload, connections held by old workers (e.g. hub sockets to
# an instance that was just drained) are closed within this bound, so clients
# reconnect through the new routing instead of lingering on the old instance.
worker_shutdown_timeout 30s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Knowledge uploads are capped at 10 MB by the API; allow multipart overhead.
    client_max_body_size 11m;

    # Access log without query strings: the public chat hub carries a short-lived
    # ticket in its query, and nothing secret belongs in a log line.
    log_format edge '$remote_addr [$time_iso8601] "$request_method $uri" $status '
                    '$body_bytes_sent $request_time $upstream_addr $upstream_status';
    access_log /dev/stdout edge;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Both upstreams (omniai_api, and omniai_hubs with client affinity) are
    # rendered by readiness-watcher.sh from each instance's /health/ready: an
    # unready instance is marked `down` and receives no new requests. Fixed
    # addresses (compose), so a recreated container needs no DNS re-resolution.
    # SignalR affinity: negotiate and connect must reach the same instance
    # (consistent hash on the client address); events still reach every client
    # through the Redis backplane.
    include /tmp/omniai/upstreams.conf;

    # The two server blocks, rendered from templates/omniai.conf.template by the
    # image entrypoint (envsubst of OMNIAI_* variables only).
    include /etc/nginx/conf.d/*.conf;
}
