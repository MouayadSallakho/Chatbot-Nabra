@switch (state()) {
  @case ('notEmbedded') {
    <!--
      Somebody opened the iframe address directly. This is not a chat surface:
      the widget has no website to be checked against, so there is nothing it
      could be allowed to do here. It says so plainly rather than showing a
      launcher that would refuse every click.
    -->
    <div class="embed-standalone">
      <div class="state">
        <h1 class="state-title" i18n="@@visitor.standalone.title">This page is a chat widget</h1>
        <p class="state-description" i18n="@@visitor.standalone.body">
          It runs inside a website that has installed it, and is not meant to be opened on its own.
        </p>
      </div>
    </div>
  }

  @case ('ready') {
    <!--
      Closed, the whole document is this one button inside the loader's 84px
      frame. Nothing else is rendered, so the corners of the frame stay
      transparent and the page shows through around the circle.
    -->
    @if (!panelOpen()) {
      <app-chat-launcher
        [label]="launcherLabel()"
        [side]="launcherSide()"
        (pressed)="openPanel()"
      />
    } @else {
      <app-chat-panel
        class="embed-panel"
        variant="widget"
        [agentName]="agentName()"
        [greeting]="greeting()"
        [messages]="messages()"
        [handling]="handling()"
        [sending]="sending()"
        [failure]="sendFailure()"
        [canSend]="canSend()"
        [hasConversation]="hasConversation()"
        [closable]="true"
        [maxLength]="maxLength"
        [(draft)]="draft"
        (send)="send()"
        (newChat)="startNewConversation()"
        (closed)="closePanel()"
      />
    }
  }
}
