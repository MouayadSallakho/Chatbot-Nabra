<div
  class="sidebar"
  [class.is-rail]="rail()"
  [class.is-expanded]="expanded()"
  [class.is-drawer]="drawer()"
  [class.is-open]="drawer() && open()"
  (pointerenter)="onPointerEnter($event)"
  (pointerleave)="onPointerLeave($event)"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)"
  (keydown.escape)="onEscape($event)"
>
  <div class="sidebar-brand">
    <!--
      The product mark. Two dots, the larger leading the smaller: a customer and
      the agent answering. Decorative, so it is hidden from assistive technology
      -- the wordmark beside it already carries the name.
    -->
    <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
      <rect width="28" height="28" rx="7" fill="currentColor" />
      <circle cx="11" cy="11.5" r="3.25" fill="var(--accent-contrast)" />
      <circle cx="18" cy="17" r="2.25" fill="var(--accent-contrast)" fill-opacity="0.7" />
    </svg>
    <span class="brand-name fades">OmniAI</span>

    @if (drawer()) {
      <button
        #dismissButton
        type="button"
        class="btn btn-ghost btn-icon btn-sm sidebar-dismiss"
        (click)="dismissed.emit()"
      >
        <app-icon name="close" [strokeWidth]="1.75" />
        <span class="visually-hidden">Close navigation</span>
      </button>
    }
  </div>

  <!--
    `aria-label` distinguishes this from any other navigation landmark. Each
    section's list is labelled by its heading, so a screen reader announces
    "Work, list, 3 items" rather than one undifferentiated run of links.
  -->
  <nav class="sidebar-nav" aria-label="Primary">
    @for (group of groups(); track group.name) {
      <div class="nav-group">
        <p class="nav-group-label" [id]="'nav-group-' + group.name">
          <span class="fades">{{ group.name }}</span>
        </p>
        <ul [attr.aria-labelledby]="'nav-group-' + group.name">
          @for (item of group.items; track item.path) {
            <li>
              <a
                class="nav-item"
                [routerLink]="item.path"
                routerLinkActive="is-active"
                ariaCurrentWhenActive="page"
                (click)="navigated.emit()"
              >
                <app-icon [name]="item.icon" [strokeWidth]="1.6" />
                <!--
                  Always in the DOM and in the accessibility tree: collapsed to the
                  rail it is clipped and transparent, never removed, so the link
                  keeps its name. The rail expands on hover and on focus, which is
                  what a sighted reader gets in place of a tooltip.
                -->
                <span class="nav-label fades">{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <!-- Pinning is a desktop choice. In drawer mode the sidebar is already an overlay. -->
  @if (!drawer()) {
    <div class="sidebar-footer">
      <button type="button" class="nav-item pin-toggle" (click)="pinToggled.emit()">
        <app-icon [name]="pinned() ? 'chevron-start' : 'pin'" [strokeWidth]="1.6" />
        <span class="nav-label fades">{{ pinned() ? 'Unpin sidebar' : 'Pin sidebar' }}</span>
      </button>
    </div>
  }
</div>
