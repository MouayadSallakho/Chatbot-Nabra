<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OmniAI Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Theme resolution, before first paint.

      This runs synchronously in <head>, ahead of any stylesheet being applied to
      a rendered frame, so the correct palette is in place the moment the page is
      painted. Without it the browser paints the light default, Angular boots,
      and a dark-mode user sees a white flash on every single load -- the kind of
      detail that separates a product from a project.

      It is inline for the same reason: an external file is one more round trip
      during which that flash happens anyway.

      COUPLED TO ThemeService. The storage key, the attribute name and the two
      attribute values are duplicated here from src/app/core/theme/theme.ts. That
      duplication is deliberate and unavoidable -- this has to run before the
      bundle exists -- and it is asserted by a unit test that reads this file, so
      the two cannot drift apart silently.

      Wrapped in try/catch because localStorage throws outright, rather than
      returning null, in some privacy modes. A failure here must degrade to the
      light default, never to a blank page.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('omniai.theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <!--
      The deliberate initial state, painted before the bundle has parsed.

      Authentication is resolved before the first route renders, which is what
      stops a reload from flashing a sign-in form at somebody who is already
      signed in. The cost is two requests before first paint, and this covers
      that moment with something honest instead of a blank white page.

      It lives inside <app-root> so Angular replaces it on bootstrap; there is no
      code anywhere that has to remember to remove it. Everything it needs is
      inline -- no stylesheet has loaded yet -- and every colour is read from the
      same design tokens the application uses, so it is already correct in dark
      mode thanks to the script above.

      aria-live and role="status" so a screen reader is told something is
      happening rather than meeting silence.
    -->
    <app-root>
      <div
        style="
          display: grid;
          place-items: center;
          min-height: 100vh;
          font-family:
            system-ui,
            -apple-system,
            'Segoe UI',
            sans-serif;
        "
      >
        <p role="status" aria-live="polite" style="color: #646e7f; font-size: 0.875rem">
          Loading OmniAI…
        </p>
      </div>
    </app-root>
  </body>
</html>
