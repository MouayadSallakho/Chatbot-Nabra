<div class="topbar">
  @if (drawer()) {
    <button
      #menuButton
      type="button"
      class="btn btn-ghost btn-icon topbar-menu"
      (click)="menuToggled.emit()"
      [attr.aria-expanded]="navOpen()"
      aria-controls="primary-navigation"
    >
      <app-icon name="menu" [strokeWidth]="1.75" />
      <!--
        The button's accessible name. It stays "Navigation" in both states: the
        open/closed distinction is what aria-expanded is for.
      -->
      <span class="visually-hidden">Navigation</span>
    </button>
  }

  <!--
    Global context: which workspace every screen is about. Context, not a
    heading -- the page's own <h1> lives in its page header.
  -->
  <p class="topbar-context">
    <span class="visually-hidden">Workspace: </span>
    @if (workspaceName()) {
      <span class="topbar-workspace" [title]="workspaceName()">{{ workspaceName() }}</span>
    } @else {
      <!-- Holds the bar's height while the workspace loads, so nothing shifts. -->
      <span class="skeleton topbar-workspace-skeleton" aria-hidden="true"></span>
    }
  </p>

  <div class="topbar-actions">
    <app-notification-bell />
    <app-profile-menu
      [email]="userEmail()"
      [workspaceName]="workspaceName()"
      [canSwitchWorkspace]="canSwitchWorkspace()"
      (workspaceSwitched)="workspaceSwitched.emit()"
      (signedOut)="signedOut.emit()"
    />
  </div>
</div>
