<div class="entry">
  <!-- The ground's two soft glows, as in the shell. Decoration only. -->
  <span class="entry-glow entry-glow-a" aria-hidden="true"></span>
  <span class="entry-glow entry-glow-b" aria-hidden="true"></span>

  <div class="entry-column">
    <header class="entry-header">
      <!--
        The lockup: the mark and the name in both scripts, the page's language
        first. One image named "Nabra" for assistive technology.
      -->
      <app-brand-lockup class="entry-lockup" data-testid="entry-lockup" />

      @if (languageSwitch()) {
        <!--
          Each language in its own name, its own lang and its own direction, so
          somebody who cannot read the current page still finds theirs. A choice
          reloads the page in that language.
        -->
        <div
          app-segmented
          class="entry-language"
          role="group"
          aria-label="Language"
          i18n-aria-label="@@entry.language"
          data-testid="entry-language"
        >
          @for (option of languages; track option.value) {
            <button
              type="button"
              class="segmented-option"
              [attr.lang]="option.value"
              [attr.dir]="option.dir"
              [attr.aria-pressed]="option.value === current"
              [attr.data-testid]="'entry-language-' + option.value"
              (click)="choose(option.value)"
            >
              {{ option.name }}
            </button>
          }
        </div>
      }
    </header>

    <main class="entry-main" id="main-content" tabindex="-1">
      <!-- The page itself, on one solid panel: the form comes first, everywhere. -->
      <div class="entry-panel">
        <ng-content />
      </div>
    </main>
  </div>

  <!--
    The brand side: the mark, one serif line and one sentence of promise on a
    deep panel. Decoration, so it is hidden from assistive technology and holds
    nothing a reader needs: every page's heading, words and actions are in the
    form. Beside the form from 1024px; after it, in reading order and on screen,
    on a phone. Drawn with CSS and inline SVG only: no image to download.
  -->
  <aside class="entry-brand" aria-hidden="true" data-testid="entry-brand">
    <svg
      class="entry-brand-mark"
      [class.is-settling]="settle"
      [attr.viewBox]="mark.viewBox"
      focusable="false"
    >
      <circle class="mark-ai" [attr.cx]="mark.ai.cx" [attr.cy]="mark.ai.cy" [attr.r]="mark.ai.r" />
      <circle
        class="mark-team"
        [attr.cx]="mark.team.cx"
        [attr.cy]="mark.team.cy"
        [attr.r]="mark.team.r"
      />
      <path class="mark-lens" [attr.d]="mark.lens" />
    </svg>

    <p class="entry-tagline" i18n="@@entry.tagline">Two voices. One tone.</p>
    <p class="entry-promise" i18n="@@entry.promise">
      The AI answers your customers. A person on your team steps in the moment one is needed.
    </p>
  </aside>
</div>
