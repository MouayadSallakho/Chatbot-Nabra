<!--
  The lockup until the public read answers, so the chat is never drawn in the
  wrong theme (only the lockup's own background can change, once). After that,
  the panel in the workspace's look, on the visitor's ground and its two glows.
-->
@if (state() === 'opening' && !appearanceKnown()) {
  <app-boot-state data-testid="chat-loading" />
} @else {
  <main class="chat-page" id="main-content" tabindex="-1">
    <app-chat-panel
      class="chat-page-panel"
      variant="page"
      [style.--chat-brand-light]="brand().light?.accent"
      [style.--chat-on-brand-light]="brand().light?.foreground"
      [style.--chat-brand-dark]="brand().dark?.accent"
      [style.--chat-on-brand-dark]="brand().dark?.foreground"
      [state]="state()"
      [agentName]="agentName()"
      [workspaceName]="workspaceName()"
      [greeting]="greeting()"
      [messages]="messages()"
      [handling]="handling()"
      [sending]="sending()"
      [failure]="sendFailure()"
      [openFailure]="openFailure()?.message ?? null"
      [canSend]="canSend()"
      [hasConversation]="hasConversation()"
      [maxLength]="maxLength"
      [(draft)]="draft"
      (send)="send()"
      (newChat)="startNewConversation()"
      (retry)="open()"
    />
  </main>
}
