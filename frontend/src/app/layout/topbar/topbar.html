<!--
  The banner landmark on a phone or a tablet: where the reader is (the area and
  the workspace) and the actions that go with every screen. A role rather than
  <header>, because the notification panel inside it has a header of its own.
-->
<div class="topbar" role="banner">
  <span class="topbar-glass glass" aria-hidden="true"></span>

  <div class="topbar-context">
    @if (areaTitle()) {
      <p class="topbar-title" data-testid="area-title">{{ areaTitle() }}</p>
    }
    <app-workspace-switcher
      class="topbar-workspace"
      [class.is-alone]="!areaTitle()"
      [name]="workspaceName()"
      [currentId]="workspaceId()"
      [workspaces]="workspaces()"
      variant="bar"
      (chosen)="workspaceChosen.emit($event)"
      (chooserRequested)="chooserRequested.emit()"
    />
  </div>

  <div class="topbar-actions">
    <button
      type="button"
      class="btn btn-quiet btn-icon"
      aria-haspopup="dialog"
      [attr.aria-expanded]="paletteOpen()"
      [attr.aria-keyshortcuts]="shortcutAria"
      [attr.aria-label]="paletteName"
      [appTooltip]="paletteName + ' ' + shortcut"
      placement="below"
      data-testid="palette-trigger"
      (click)="paletteRequested.emit()"
    >
      <app-icon name="search" [strokeWidth]="1.75" />
    </button>
    <app-notification-bell placement="bar" />
    <app-profile-menu
      [email]="email()"
      [displayName]="displayName()"
      [emailLanguage]="emailLanguage()"
      [workspaceName]="workspaceName()"
      [canSwitchWorkspace]="workspaces().length > 1"
      (workspaceSwitched)="chooserRequested.emit()"
      (signedOut)="signedOut.emit()"
    />
  </div>
</div>
