<div class="sidebar" [class.is-collapsed]="collapsed()" [class.is-drawer]="drawer()">
  <div class="sidebar-brand">
    <!--
      The product mark. Two dots, the larger leading the smaller: a customer and
      the agent answering. Decorative, so it is hidden from assistive technology
      -- the wordmark beside it already carries the name.
    -->
    <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
      <rect width="28" height="28" rx="8" fill="currentColor" />
      <circle cx="11" cy="11.5" r="3.25" fill="var(--accent-contrast)" />
      <circle cx="18" cy="17" r="2.25" fill="var(--accent-contrast)" fill-opacity="0.7" />
    </svg>
    <span class="brand-name">OmniAI</span>

    @if (drawer()) {
      <button
        #dismissButton
        type="button"
        class="btn btn-ghost btn-icon btn-sm sidebar-dismiss"
        (click)="dismissed.emit()"
      >
        <app-icon name="close" [strokeWidth]="1.75" />
        <span class="visually-hidden">Close navigation</span>
      </button>
    }
  </div>

  <!--
    `aria-label` distinguishes this from any other navigation landmark the page
    grows later. A screen reader user listing landmarks gets "Primary
    navigation" rather than two identical "navigation" entries.
  -->
  <nav class="sidebar-nav" aria-label="Primary">
    <ul>
      @for (item of items; track item.path) {
        <li>
          <a
            class="nav-item"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            [title]="item.label"
            (click)="navigated.emit()"
          >
            <app-icon [name]="item.icon" [strokeWidth]="1.6" />
            <!--
              Stays in the DOM when collapsed, hidden only visually, so the link
              keeps its accessible name. The `title` above is what a sighted
              reader gets in its place.
            -->
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!--
    Collapse is a desktop affordance. In drawer mode the sidebar is already
    dismissible, and a second control that shrinks a full-screen overlay would
    mean nothing.
  -->
  @if (!drawer()) {
    <div class="sidebar-footer">
      <button
        type="button"
        class="btn btn-ghost btn-sm collapse-toggle"
        (click)="collapseToggled.emit()"
        [attr.aria-expanded]="!collapsed()"
        aria-controls="primary-navigation"
        [title]="collapsed() ? 'Expand navigation' : 'Collapse navigation'"
      >
        <app-icon [name]="collapsed() ? 'chevron-end' : 'chevron-start'" [strokeWidth]="1.75" />
        <!--
          One label, whose text changes with the state. Collapsed, it is hidden
          visually but still names the button -- adding a second hidden label
          instead would make a screen reader read both.
        -->
        <span class="nav-label">{{
          collapsed() ? 'Expand navigation' : 'Collapse navigation'
        }}</span>
      </button>
    </div>
  }
</div>
