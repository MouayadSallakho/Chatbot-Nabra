<!--
  First in the tab order, on every page. Without it a keyboard reader tabs
  through the whole side bar before reaching the content, on every navigation.
-->
<a
  class="skip-link"
  href="#main-content"
  (click)="skipToContent($event)"
  i18n="@@shell.skipToContent"
  >Skip to main content</a
>

<div
  class="shell"
  [class.is-wide]="layout() === 'wide'"
  [class.is-rail]="layout() === 'rail'"
  [class.is-bars]="layout() === 'bars'"
>
  <!--
    The ground's two soft glows (calm-glass.md §2): emerald at the start-top,
    gold at the end-bottom. Decoration only.
  -->
  <span class="shell-glow shell-glow-a" aria-hidden="true"></span>
  <span class="shell-glow shell-glow-b" aria-hidden="true"></span>

  @if (layout() === 'bars') {
    <app-topbar
      class="shell-topbar"
      [areaTitle]="areaTitle()"
      [workspaceName]="workspaceName()"
      [workspaceId]="workspaceId()"
      [workspaces]="workspaces()"
      [email]="userEmail()"
      [displayName]="userDisplayName()"
      [emailLanguage]="userEmailLanguage()"
      [paletteOpen]="paletteOpen()"
      (paletteRequested)="openPalette()"
      (workspaceChosen)="switchTo($event)"
      (chooserRequested)="openChooser()"
      (signedOut)="signOut()"
    />
  } @else {
    <app-sidebar
      id="primary-navigation"
      class="shell-sidebar"
      [collapsed]="layout() === 'rail'"
      [workspaceName]="workspaceName()"
      [workspaceId]="workspaceId()"
      [workspaces]="workspaces()"
      [email]="userEmail()"
      [displayName]="userDisplayName()"
      [emailLanguage]="userEmailLanguage()"
      [paletteOpen]="paletteOpen()"
      (paletteRequested)="openPalette()"
      (workspaceChosen)="switchTo($event)"
      (chooserRequested)="openChooser()"
      (signedOut)="signOut()"
    />
  }

  <!--
    The content, on the ground. `tabindex="-1"` makes the skip link's target
    focusable, so following it actually moves focus rather than only scrolling.
  -->
  <main #mainRegion id="main-content" class="shell-main" tabindex="-1">
    <router-outlet />
  </main>

  @if (layout() === 'bars') {
    <app-bottom-bar class="shell-bottombar" />
  }

  <!--
    Rendered once, by the shell, because its live region has to exist in the DOM
    before anything is announced into it. A fixed layer; inside the frame so it
    knows where the navigation ends (bottom start on a desktop, under the top
    bar on a phone).
  -->
  <app-toast-host />
</div>

<!--
  The command palette. Its code is fetched the first time it is asked for, or
  ahead of time once the browser is idle, so it never weighs on startup and is
  usually already there by the first Ctrl+K. A modal dialog of its own.
-->
@defer (when paletteRequested(); prefetch on idle) {
  <app-command-palette
    [open]="paletteOpen()"
    (closed)="onPaletteClosed()"
    (notificationsRequested)="openNotifications()"
  />
}
