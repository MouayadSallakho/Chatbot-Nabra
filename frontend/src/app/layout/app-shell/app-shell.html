<!--
  First in the tab order, on every page. Without it a keyboard reader tabs
  through the whole sidebar before reaching the content, on every navigation.
-->
<a
  class="skip-link"
  href="#main-content"
  (click)="skipToContent($event)"
  i18n="@@shell.skipToContent"
  >Skip to main content</a
>

<div class="shell" [class.is-drawer]="drawer()" [class.is-pinned]="pinned()">
  <app-sidebar
    id="primary-navigation"
    class="shell-sidebar"
    [class.is-open]="navOpen()"
    [pinned]="pinned()"
    [drawer]="drawer()"
    [open]="navOpen()"
    [attr.inert]="navHidden() ? '' : null"
    (pinToggled)="togglePinned()"
    (dismissed)="closeNav()"
    (navigated)="onNavigated()"
  />

  @if (drawer()) {
    <!--
      The scrim. Purely presentational: it is hidden from assistive technology
      and is not the accessible way to dismiss the drawer -- Escape and the close
      button are. It exists so a pointer user can tap away, and so the content
      behind reads as unavailable.
    -->
    <div
      class="shell-scrim"
      [class.is-visible]="navOpen()"
      aria-hidden="true"
      (click)="closeNav()"
    ></div>
  }

  <!--
    Made inert while the drawer is open, which is what turns the drawer into a
    real modal surface: focus cannot tab out behind it, and a screen reader
    cannot wander into content the reader cannot see.
  -->
  <div class="shell-content" [attr.inert]="navOpen() ? '' : null">
    <app-topbar
      [drawer]="drawer()"
      [navOpen]="navOpen()"
      [workspaceName]="workspaceName()"
      [userEmail]="userEmail()"
      [userEmailLanguage]="userEmailLanguage()"
      [canSwitchWorkspace]="canSwitchWorkspace()"
      [paletteOpen]="paletteOpen()"
      (paletteRequested)="openPalette()"
      (menuToggled)="toggleNav()"
      (workspaceSwitched)="switchWorkspace()"
      (signedOut)="signOut()"
    />

    <!--
      `tabindex="-1"` makes the skip link's target focusable, so following it
      actually moves focus rather than only scrolling.
    -->
    <main #mainRegion id="main-content" class="shell-main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>

<!--
  The command palette. Its code is fetched the first time it is asked for, or
  ahead of time once the browser is idle, so it never weighs on startup and is
  usually already there by the first Ctrl+K. Outside the inert content: it is a
  modal dialog of its own.
-->
@defer (when paletteRequested(); prefetch on idle) {
  <app-command-palette
    [open]="paletteOpen()"
    (closed)="onPaletteClosed()"
    (notificationsRequested)="openNotifications()"
  />
}

<!--
  Rendered once, by the shell, because its live region has to exist in the DOM
  before anything is announced into it. Outside the grid: it is a fixed layer,
  and as a grid child it would have claimed a row of its own.
-->
<app-toast-host />
