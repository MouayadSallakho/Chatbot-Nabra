# Shared by every location proxied to the API. Included per location on
# purpose (see templates/omniai.conf.template): nginx does not merge
# proxy_set_header or add_header across levels.

proxy_http_version 1.1;

# Never compress API responses. nginx turns a strong ETag into a weak one
# (W/"...") when it gzips, and the API rightly refuses weak entity tags for
# If-Match -- so compression here broke every optimistic-concurrency write in
# the Admin (found by the Phase 35 Chrome pass). The static SPA is still gzipped.
gzip off;

# Preserve Host: the widget snippet and loader URLs are built from it.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto https;
# Overwritten, never appended: the API trusts exactly one hop, this one, so a
# client-supplied X-Forwarded-For can never reach it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host "";

proxy_connect_timeout 3s;
# Idempotent requests, or requests never sent, move to the other instance; a
# non-idempotent request already sent is never replayed (nginx default).
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;

# HSTS on every proxied response, set once here (ASP.NET omits it for loopback
# host names, and two headers would be ambiguous).
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security "max-age=31536000" always;
