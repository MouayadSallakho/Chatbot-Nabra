<div class="topbar">
  @if (drawer()) {
    <button
      #menuButton
      type="button"
      class="btn btn-ghost btn-icon topbar-menu"
      (click)="menuToggled.emit()"
      [attr.aria-expanded]="navOpen()"
      aria-controls="primary-navigation"
    >
      <app-icon name="menu" [strokeWidth]="1.75" />
      <!--
        The button's accessible name. It stays "Navigation" in both states: the
        open/closed distinction is what aria-expanded is for, and putting it in
        the name as well would have a screen reader announce the state twice.
      -->
      <span class="visually-hidden">Navigation</span>
    </button>
  }

  <!--
    Context, not a heading. The page's own <h1> lives in the page header; making
    this one too would give every screen two level-one headings and break the
    document outline that heading navigation depends on.
  -->
  <p class="topbar-context">{{ pageTitle() }}</p>

  <div class="topbar-actions">
    <app-theme-toggle />
    <app-notification-bell />
  </div>
</div>
